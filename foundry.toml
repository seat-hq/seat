[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["contracts/lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[rpc_endpoints]
robinhood = "${RH_RPC_URL}"
robinhood_testnet = "${RH_TESTNET_RPC_URL}"

[etherscan]
robinhood = { key = "verifycontract", url = "https://robinhoodchain.blockscout.com/api" }
